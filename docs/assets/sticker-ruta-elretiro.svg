<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2b2118" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1E6"/>
      <stop offset="1" stop-color="#EFE6D5"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="40" y="40" width="920" height="560" rx="46" fill="url(#card)" filter="url(#shadow)"/>
  <rect x="40" y="40" width="920" height="560" rx="46" fill="none" stroke="#6F4E37" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Header -->
  <text x="500" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#6F4E37" letter-spacing="3">DE MEDELLÍN AL PARQUE DE</text>
  <text x="500" y="182" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#3E5641" letter-spacing="2">EL RETIRO</text>

  <!-- Winding dotted road -->
  <path d="M 175 430 C 300 360, 320 500, 460 430 S 660 350, 830 300"
        fill="none" stroke="#6F4E37" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="2 26" stroke-opacity="0.7"/>

  <!-- Point A: Medellín -->
  <circle cx="175" cy="430" r="20" fill="#C8956B"/>
  <circle cx="175" cy="430" r="20" fill="none" stroke="#6F4E37" stroke-width="4"/>
  <circle cx="175" cy="430" r="7" fill="#F7F1E6"/>
  <text x="175" y="500" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="bold" fill="#3E5641">Medellín</text>

  <!-- Car on the road -->
  <g transform="translate(455 415) rotate(-8)">
    <rect x="-34" y="-14" width="68" height="26" rx="10" fill="#3E5641"/>
    <rect x="-20" y="-26" width="40" height="18" rx="7" fill="#5A7052"/>
    <circle cx="-18" cy="14" r="9" fill="#2b2118"/>
    <circle cx="18" cy="14" r="9" fill="#2b2118"/>
  </g>

  <!-- 1 hora badge -->
  <g transform="translate(455 350)">
    <rect x="-100" y="-38" width="200" height="66" rx="33" fill="#3E5641"/>
    <!-- clock icon -->
    <circle cx="-58" cy="-6" r="15" fill="none" stroke="#C8A96A" stroke-width="4"/>
    <path d="M -58 -6 L -58 -15 M -58 -6 L -50 -6" stroke="#C8A96A" stroke-width="4" stroke-linecap="round"/>
    <text x="12" y="-2" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F7F1E6">1 hora</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#C8A96A" letter-spacing="1">≈ 35 km en carro</text>
  </g>

  <!-- Point B: El Retiro pin (the store, in the park) -->
  <g transform="translate(830 300)">
    <path d="M 0 -58 C 34 -58, 52 -32, 52 -6 C 52 22, 20 40, 0 74 C -20 40, -52 22, -52 -6 C -52 -32, -34 -58, 0 -58 Z"
          fill="#3E5641" stroke="#2b3a2b" stroke-width="3"/>
    <circle cx="0" cy="-8" r="26" fill="#F7F1E6"/>
    <!-- little tree / park -->
    <rect x="-4" y="-6" width="8" height="16" fill="#6F4E37"/>
    <circle cx="0" cy="-14" r="15" fill="#5A7052"/>
  </g>
  <text x="820" y="410" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="bold" fill="#3E5641">El Retiro</text>
  <text x="820" y="442" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#6F4E37">En el parque principal</text>

  <!-- Footer tagline -->
  <text x="500" y="558" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#6F4E37">Sí, vale el viaje</text>
  <path d="M 690 548 l 5 -13 l 5 13 l 13 5 l -13 5 l -5 13 l -5 -13 l -13 -5 z" fill="#C8A96A"/>
</svg>
